name: Craft Platform CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-validate:
    name: Lint, TypeCheck & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Analysis
        run: npx tsc --noEmit

      - name: Security Vulnerability Scan
        run: npm audit --audit-level=critical || true

      - name: Build Next.js Application (Production Standalone)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ttjobsgglwgyioqlldqj.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0am9ic2dnbHdneWlvcWxsZHFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzIxMjIsImV4cCI6MjEwMzM0ODEyMn0.gJPw6lkAoYCQkIaw8uv0iDtou_XO-OzLQY368qA2FBA' }}
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Verify Dockerfile Syntax
        run: |
          docker build --dry-run . || true
